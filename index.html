<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Patience is Key</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    transition: background-color 0.5s ease;
  }
</style>
</head>
<body>

<script>
  const colors = [
    "#ff00d2", "#e21b01", "#031d6a", "#5b04e2", "#fff100",
    "#ee720f", "#3029ff", "#491d92", "#8d8bd1", "108965",
    "#17670b", "#13fcff", "#404042", "#97acc8", "#fd7472",
    "#7c1818", "#d3a005", "#fbc193", "#fbf193", "#689581",
    "#4a90e2", "#ff94fb", "#dcafff", "#0354c8", "#91eaa1",
    "#f7e4aa"
  ];

  let index = 0;

  function changeColor() {
    document.body.style.backgroundColor = colors[index];
    index = (index + 1) % colors.length;
  }

  // set initial color immediately
  changeColor();

  // change every 3 seconds, potentially adjust unsure
  setInterval(changeColor, 3000);
</script>
